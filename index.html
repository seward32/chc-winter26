<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cross Handed Crew — Winter 2026 World Tour</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--augusta-green:#006747;--augusta-dark:#004d35;--augusta-deepest:#00311f;--augusta-yellow:#f2c75c;--augusta-gold:#d4a843;--augusta-cream:#faf6ee;--augusta-sand:#f0e8d8;--birdie-red:#c0392b;--bogey-blue:#2c5f8a;--text-dark:#1a1a1a;--text-muted:#6b6b5e}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:"DM Sans",sans-serif;background:var(--augusta-cream);color:var(--text-dark);line-height:1.6}
.hero{background:linear-gradient(165deg,var(--augusta-deepest) 0%,var(--augusta-green) 50%,var(--augusta-dark) 100%);padding:4rem 2rem 3rem;text-align:center;position:relative;overflow:hidden}

.schedule{width:100%;border-collapse:collapse;font-size:.85rem}

.week-badge{display:inline-block;background:var(--augusta-yellow);color:var(--augusta-deepest);font-size:.65rem;font-weight:700;letter-spacing:.15em;padding:.2rem .8rem;margin-bottom:.5rem}

.week-winner{display:inline-block;margin-top:.6rem;background:rgba(242,199,92,.15);border:1px solid rgba(242,199,92,.3);padding:.25rem .8rem;border-radius:3px;font-size:.75rem;color:var(--augusta-yellow);font-weight:500}
.scorecard-scroll{overflow-x:auto;padding:0 1rem}
.scorecard{width:100%;border-collapse:collapse;font-size:.78rem;margin:1rem 0;min-width:780px}
.scorecard th,.scorecard td{padding:.4rem .35rem;text-align:center;white-space:nowrap}
.scorecard .hole-row th{background:var(--augusta-green);color:#fff;font-weight:600;font-size:.68rem;letter-spacing:.03em}
.scorecard .hole-row th:first-child{text-align:left;padding-left:.8rem;min-width:80px}
.scorecard .subtotal-hdr{background:var(--augusta-dark)!important}
.scorecard .total-hdr{background:var(--augusta-deepest)!important}
.scorecard .stab-hdr{background:var(--augusta-yellow)!important;color:var(--augusta-deepest)!important;font-weight:700}
.scorecard .bonus-hdr{background:var(--augusta-gold)!important;color:var(--augusta-deepest)!important;font-weight:700;font-size:.65rem}
.scorecard .par-row{background:var(--augusta-sand);font-weight:600;font-size:.75rem}
.scorecard .par-row td:first-child,.scorecard .si-row td:first-child{text-align:left;padding-left:.8rem}
.scorecard .si-row{background:rgba(0,103,71,.04);color:var(--text-muted);font-size:.7rem}
.scorecard tbody tr:not(.par-row):not(.si-row) td:first-child{text-align:left;padding-left:.8rem;font-weight:600;font-family:"Source Serif 4",serif}
.scorecard .subtotal{font-weight:700;background:rgba(0,103,71,.06)}
.scorecard .total{font-weight:700;background:rgba(0,103,71,.1)}
.scorecard .stab-total{font-weight:800;background:var(--augusta-yellow);color:var(--augusta-deepest);font-size:.88rem}
.scorecard .hcp{color:var(--text-muted);font-size:.72rem}
.scorecard .bonus-earned{font-weight:700;color:var(--augusta-gold);background:rgba(212,168,67,.1)}
.scorecard .bonus-zero{color:var(--text-muted);font-size:.72rem}
.birdie{color:var(--birdie-red);font-weight:700;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--birdie-red);line-height:1}
.eagle{color:var(--birdie-red);font-weight:700;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--birdie-red);outline:2px solid var(--birdie-red);outline-offset:2px;line-height:1}
.bogey{color:var(--bogey-blue);display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:2px solid var(--bogey-blue);line-height:1}
.double-bogey{color:var(--bogey-blue);display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:2px solid var(--bogey-blue);outline:2px solid var(--bogey-blue);outline-offset:2px;line-height:1}
.par-score{color:var(--text-dark)}
.stab-birdie{color:var(--birdie-red);font-weight:700}.stab-bogey{color:var(--bogey-blue)}.stab-par{color:var(--text-dark)}
.stab-detail-label{font-family:"DM Sans",sans-serif;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);padding:.8rem 2rem 0}
.footer{text-align:center;padding:2rem;font-size:.7rem;color:var(--text-muted);border-top:1px solid rgba(0,103,71,.1);margin-top:2rem}
td.stroke-1{background:rgba(0,103,71,.08)}td.stroke-2{background:rgba(0,103,71,.18)}
.stats-wrap{overflow-x:auto;margin-bottom:2rem}
.stats-table{width:100%;border-collapse:collapse;font-size:.9rem}
.stats-table thead th{background:var(--augusta-green);color:#fff;font-weight:600;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:.75rem 1rem;text-align:center;white-space:nowrap}
.stats-table thead th:nth-child(1){text-align:left}
.stats-table td{padding:.7rem 1rem;text-align:center;border-bottom:1px solid rgba(0,103,71,.1)}
.stats-table tr:hover{background:rgba(0,103,71,.04)}
.stats-table .player-name{text-align:left;font-weight:600;font-family:"Source Serif 4",serif;font-size:1rem}
.stats-table .stat-highlight{font-weight:700;color:var(--augusta-dark)}
/* Projection styles */
.proj-wrap{overflow-x:auto;margin-bottom:2rem}
.proj-table{width:100%;border-collapse:collapse;font-size:.9rem}
.proj-table thead th{background:var(--augusta-deepest);color:#fff;font-weight:600;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:.75rem 1rem;text-align:center;white-space:nowrap}
.proj-table thead th:nth-child(2){text-align:left}
.proj-table thead th.proj-col{background:var(--augusta-yellow);color:var(--augusta-deepest)}
.proj-table td{padding:.7rem 1rem;text-align:center;border-bottom:1px solid rgba(0,103,71,.1)}
.proj-table tr:hover{background:rgba(0,103,71,.04)}
.proj-table .rank{font-family:"Playfair Display",serif;font-weight:700;font-size:1.1rem}
.proj-table .rank.gold{color:var(--augusta-gold)}.proj-table .rank.silver{color:#8a8a8a}.proj-table .rank.bronze{color:#a0785a}
.proj-table .player-name{text-align:left;font-weight:600;font-family:"Source Serif 4",serif;font-size:1rem}
.proj-table .proj-total{font-weight:700;font-size:1.05rem;color:var(--augusta-deepest)}
.proj-table .proj-remaining{color:var(--text-muted);font-size:.8rem;font-style:italic}
.proj-bar-wrap{margin:1rem 0 2rem;padding:.5rem 0}
.proj-bar-row{display:flex;align-items:center;gap:1rem;margin-bottom:.8rem}
.proj-bar-name{font-family:"Source Serif 4",serif;font-weight:600;width:70px;text-align:right;font-size:.85rem}
.proj-bar-outer{flex:1;background:rgba(0,103,71,.08);border-radius:4px;height:28px;overflow:hidden;position:relative}
.proj-bar-actual{background:var(--augusta-green);height:100%;display:inline-block;vertical-align:top;transition:width .6s ease}
.proj-bar-proj{background:rgba(242,199,92,.5);border-left:2px dashed var(--augusta-gold);height:100%;display:inline-block;vertical-align:top}
.proj-bar-label{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.75rem;font-weight:600;color:var(--augusta-deepest)}
.proj-legend{display:flex;gap:1.5rem;font-size:.75rem;color:var(--text-muted);margin-bottom:1rem}
.proj-legend span{display:flex;align-items:center;gap:.4rem}
.proj-legend .swatch{width:14px;height:14px;border-radius:2px;display:inline-block}
.proj-legend .swatch.actual{background:var(--augusta-green)}
.proj-legend .swatch.projected{background:rgba(242,199,92,.5);border:1px dashed var(--augusta-gold)}
.proj-note{font-size:.75rem;color:var(--text-muted);font-style:italic;margin-top:.5rem}
#loading{text-align:center;padding:4rem;color:var(--text-muted);font-family:"Source Serif 4",serif;font-style:italic;font-size:1.1rem}
@media(max-width:768px){.hero h1{font-size:2rem}.container{padding:1rem}.week-header{padding:1rem 1.2rem}.week-header h2{font-size:1.2rem}.week-tab{padding:.5rem .8rem;font-size:.72rem}.week-tab .tab-course{font-size:.6rem}.proj-bar-name{width:50px}}
</style></head><body>
<header class="hero">
  <div class="hero-badge">Cross Handed Crew</div>
  <h1>Winter 2026 World Tour</h1>
  <div class="divider"></div>
  <p class="season">2025–2026</p>
  <p class="format">Standard Stableford · Net Scoring · 18 Holes</p>
</header>
<div class="container">
  <div id="loading">Loading league data…</div>
  <div id="app" style="display:none"></div>
</div>
<script>
// ── Stableford Engine ─────────────────────────────────────────────────────────
function getAdjs(handicap, hcp) {
  const abs = Math.abs(handicap);
  return hcp.map(si => si <= abs ? (handicap < 0 ? 1 : -1) : 0);
}
function holeStab(gross, par, adj) {
  const d = (gross + adj) - par;
  return d <= -2 ? 4 : d === -1 ? 3 : d === 0 ? 2 : d === 1 ? 1 : 0;
}
function calcWeek(week) {
  const { par, hcp } = week.courseInfo;
  const players = Object.keys(week.scores);
  const res = {};
  players.forEach(name => {
    const { handicap, holes } = week.scores[name];
    const adjs = getAdjs(handicap, hcp);
    const strokeHoles = adjs.map(a => a !== 0);
    const holeStabs = holes.map((g, i) => holeStab(g, par[i], adjs[i]));
    res[name] = { gross: holes.reduce((a,b)=>a+b,0), stableford: holeStabs.reduce((a,b)=>a+b,0), holeStabs, strokeHoles, handicap, adjs };
  });
  const max = Math.max(...players.map(n => res[n].stableford));
  const winners = players.filter(n => res[n].stableford === max);
  const bonusEach = Math.floor(4 / winners.length);
  players.forEach(n => { res[n].bonus = winners.includes(n) ? bonusEach : 0; res[n].isWinner = winners.includes(n); });
  res._winners = winners; res._max = max; res._players = players;
  return res;
}

// ── Display Helpers ───────────────────────────────────────────────────────────
function scoreSymbol(g, par) {
  const d = g - par;
  if (d <= -2) return `<span class="eagle">${g}</span>`;
  if (d === -1) return `<span class="birdie">${g}</span>`;
  if (d === 0)  return `<span class="par-score">${g}</span>`;
  if (d === 1)  return `<span class="bogey">${g}</span>`;
  return `<span class="double-bogey">${g}</span>`;
}
function stabCls(p) { return p >= 3 ? 'stab-birdie' : p === 2 ? 'stab-par' : 'stab-bogey'; }
function hcpDisp(h) { return h < 0 ? `+${Math.abs(h)}` : `${h}`; }
function fmtBonus(b) { return b === 0 ? '+0' : b % 1 === 0 ? `+${b}` : `+${b.toFixed(1)}`; }
function shortCourse(c) { return c.replace('St Andrews Links Old Course','Old Course').replace('Royal Portrush — Dunluce Links','Royal Portrush'); }

// ── Scorecard Renderer ────────────────────────────────────────────────────────
function renderScorecard(wk, week, res, schedule) {
  const { par, hcp } = week.courseInfo;
  const players = res._players;
  const s = schedule.find(x => x.week === wk);
  const parTotal = par.reduce((a,b)=>a+b,0);
  const outPar = par.slice(0,9).reduce((a,b)=>a+b,0);
  const inPar  = par.slice(9).reduce((a,b)=>a+b,0);
  const nineHdrs = (start) => [...Array(9)].map((_,i)=>`<th>${start+i}</th>`).join('');

  // Winner banner
  const winners = res._winners, max = res._max;
  let winHtml;
  const allPlayers = res._players;
  if (winners.length === allPlayers.length && allPlayers.length > 1) {
    winHtml = `<div class="week-winner"><span class="winner-icon">🤝</span> Three-way tie — ${max} pts each (+1 bonus ea.)</div>`;
  } else if (winners.length > 1) {
    winHtml = `<div class="week-winner"><span class="winner-icon">🤝</span> Tied — ${winners.join(' & ')} — ${max} pts each</div>`;
  } else {
    winHtml = `<div class="week-winner"><span class="winner-icon">🏆</span> ${winners[0]} — ${max} pts</div>`;
  }

  const gHdr = `<tr class="hole-row"><th>Player</th><th>HCP</th>${nineHdrs(1)}<th class="subtotal-hdr">OUT</th>${nineHdrs(10)}<th class="subtotal-hdr">IN</th><th class="total-hdr">GRS</th><th class="total-hdr">NET</th><th class="stab-hdr">STB</th><th class="bonus-hdr">BNS</th></tr>`;
  const parRow = `<tr class="par-row"><td>Par</td><td></td>${par.slice(0,9).map(p=>`<td>${p}</td>`).join('')}<td class="subtotal">${outPar}</td>${par.slice(9).map(p=>`<td>${p}</td>`).join('')}<td class="subtotal">${inPar}</td><td class="total">${parTotal}</td><td></td><td></td><td></td></tr>`;
  const siRow = `<tr class="si-row"><td>SI</td><td></td>${hcp.slice(0,9).map(h=>`<td>${h}</td>`).join('')}<td></td>${hcp.slice(9).map(h=>`<td>${h}</td>`).join('')}<td></td><td></td><td></td><td></td><td></td></tr>`;

  const pRows = players.map(name => {
    const r = res[name], holes = week.scores[name].holes;
    const outG = holes.slice(0,9).reduce((a,b)=>a+b,0), inG = holes.slice(9).reduce((a,b)=>a+b,0);
    const cells = holes.map((g,i) => {
      const sc = r.strokeHoles[i] ? (r.handicap < 0 ? 'stroke-2' : 'stroke-1') : '';
      return `<td class="${sc}">${scoreSymbol(g, par[i])}</td>`;
    });
    const bns = r.bonus > 0 ? `<td class="bonus-earned">${fmtBonus(r.bonus)}</td>` : `<td class="bonus-zero">+0</td>`;
    return `<tr><td class="player-name">${name}</td><td class="hcp">${hcpDisp(r.handicap)}</td>${cells.slice(0,9).join('')}<td class="subtotal">${outG}</td>${cells.slice(9).join('')}<td class="subtotal">${inG}</td><td class="total">${outG+inG}</td><td class="total">${outG+inG-r.handicap}</td><td class="stab-total">${r.stableford}</td>${bns}</tr>`;
  }).join('');

  const sHdr = `<tr class="hole-row"><th>Player</th><th></th>${nineHdrs(1)}<th class="subtotal-hdr">OUT</th>${nineHdrs(10)}<th class="subtotal-hdr">IN</th><th colspan="2"></th><th class="stab-hdr">TOT</th><th></th></tr>`;
  const sRows = players.map(name => {
    const r = res[name];
    const outS = r.holeStabs.slice(0,9).reduce((a,b)=>a+b,0), inS = r.holeStabs.slice(9).reduce((a,b)=>a+b,0);
    const out9 = r.holeStabs.slice(0,9).map(p=>`<td class="${stabCls(p)}">${p}</td>`).join('');
    const in9  = r.holeStabs.slice(9).map(p=>`<td class="${stabCls(p)}">${p}</td>`).join('');
    return `<tr><td class="player-name">${name}</td><td></td>${out9}<td class="subtotal">${outS}</td>${in9}<td class="subtotal">${inS}</td><td colspan="2"></td><td class="stab-total">${r.stableford}</td><td></td></tr>`;
  }).join('');

  return `<section class="week-card" id="week-${wk}">
  <div class="week-header"><div class="week-badge">WEEK ${wk}</div><h2>${s.course}</h2><p class="week-meta">${s.location} · ${s.date} · Par ${parTotal}</p>${winHtml}</div>
  <div class="scorecard-scroll"><table class="scorecard"><thead>${gHdr}</thead><tbody>${parRow}${siRow}${pRows}</tbody></table></div>
  <h3 class="stab-detail-label">Stableford Points</h3>
  <div class="scorecard-scroll"><table class="scorecard"><thead>${sHdr}</thead><tbody>${sRows}</tbody></table></div>
</section>`;
}

// ── Standings ─────────────────────────────────────────────────────────────────
function renderStandings(players, allRes) {
  const rankCls = ['gold','silver','bronze'];
  const data = players.map(name => {
    const wks = Object.values(allRes).filter(r => r[name]);
    const stab = wks.reduce((s,r) => s+r[name].stableford, 0);
    const bonus = wks.reduce((s,r) => s+r[name].bonus, 0);
    const scores = wks.map(r => r[name].stableford);
    const wins = wks.filter(r => r[name].isWinner).length;
    const n = scores.length;
    return { name, stab, bonus, total: stab+bonus, avg: n?(stab/n).toFixed(1):'–', best: n?Math.max(...scores):'–', worst: n?Math.min(...scores):'–', wins, wks: n, winPct: n?Math.round(wins/n*100)+'%':'–' };
  }).sort((a,b) => b.total - a.total);

  const rows = data.map((p,i) => `<tr><td class="rank ${rankCls[i]||''}">${i+1}</td><td class="player-name">${p.name}</td><td>${p.wks}</td><td>${p.stab}</td><td class="bonus-pts">${fmtBonus(p.bonus)}</td><td class="total-pts">${p.total.toFixed(1)}</td><td>${p.avg}</td><td>${p.best}</td><td>${p.worst}</td><td>${p.wins}</td><td>${p.winPct}</td></tr>`).join('');

  return `<h2 class="section-title">Standings</h2>
<p class="scoring-note">Weekly winner earns +4 bonus points (a Stableford eagle). Ties split the bonus.</p>
<div class="standings-wrap"><table class="standings"><thead><tr><th>#</th><th>Player</th><th>Wks</th><th>Stableford</th><th class="bonus-col">Bonus</th><th class="total-col">Total</th><th>Avg</th><th>Best</th><th>Worst</th><th>Wins</th><th>Win %</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ── Schedule ──────────────────────────────────────────────────────────────────
function renderSchedule(schedule, allRes) {
  const rows = schedule.map(s => {
    const r = allRes[s.week];
    if (!s.played || !r) return `<tr class="upcoming"><td>${s.week}</td><td>${s.date}</td><td class="course-name">${s.course}</td><td class="location">${s.location}</td><td class="winner-cell"></td><td class="status-cell">—</td></tr>`;
    const winners = r._winners, allP = r._players;
    let w = '';
    if (winners.length === allP.length && allP.length > 1) w = `Tied — ${r._max} all`;
    else if (winners.length > 1) w = `Tied — ${r._max} each`;
    else w = `${winners[0]} (${r._max})`;
    // partial round if not all 3 players present
    const totalPlayers = 3;
    const cls = allP.length < totalPlayers ? 'partial' : 'played';
    const tick = allP.length < totalPlayers ? '½' : '✓';
    return `<tr class="${cls}"><td>${s.week}</td><td>${s.date}</td><td class="course-name">${s.course}</td><td class="location">${s.location}</td><td class="winner-cell">${w}</td><td class="status-cell">${tick}</td></tr>`;
  }).join('');
  return `<h2 class="section-title">Schedule</h2>
<div class="standings-wrap"><table class="schedule"><thead><tr><th>Wk</th><th>Date</th><th>Course</th><th>Location</th><th>Winner</th><th>✓</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ── Projections ───────────────────────────────────────────────────────────────
function renderProjections(players, allRes, schedule, weeks) {
  const totalWeeks = schedule.length;
  const rankCls = ['gold','silver','bronze'];

  // Compute actual totals and averages per player
  const data = players.map(name => {
    const played = Object.entries(allRes).filter(([,r]) => r[name]);
    const stabScores = played.map(([,r]) => r[name].stableford);
    const actualStab  = stabScores.reduce((a,b)=>a+b,0);
    const actualBonus = played.reduce((s,[,r]) => s+r[name].bonus, 0);
    const actualTotal = actualStab + actualBonus;
    const n = stabScores.length;
    const avg = n ? actualStab/n : 0;
    const remaining = totalWeeks - n;

    // Project stableford for missing rounds using their own average
    const projStab = actualStab + avg * remaining;
    // Projected bonus: only count actual bonus (can't reliably project bonus without knowing all opponents)
    const projTotal = projStab + actualBonus;

    return { name, n, remaining, actualStab, actualBonus, actualTotal, avg, projStab, projTotal };
  }).sort((a,b) => b.projTotal - a.projTotal);

  // Table
  const rows = data.map((p,i) => `<tr>
    <td class="rank ${rankCls[i]||''}">${i+1}</td>
    <td class="player-name">${p.name}</td>
    <td>${p.n} / ${totalWeeks}</td>
    <td>${p.actualTotal.toFixed(1)}</td>
    <td>${p.remaining > 0 ? `+${(p.avg * p.remaining).toFixed(1)}` : '—'}</td>
    <td class="proj-total">${p.projTotal.toFixed(1)}</td>
    <td class="proj-remaining">${p.remaining > 0 ? `${p.remaining} rnd${p.remaining>1?'s':''} @ ${p.avg.toFixed(1)} avg` : 'Complete'}</td>
  </tr>`).join('');

  // Bar chart
  const maxProj = Math.max(...data.map(p => p.projTotal));
  const bars = data.map(p => {
    const actualPct = (p.actualTotal / maxProj * 100).toFixed(1);
    const projPct   = ((p.projTotal - p.actualTotal) / maxProj * 100).toFixed(1);
    return `<div class="proj-bar-row">
      <div class="proj-bar-name">${p.name}</div>
      <div class="proj-bar-outer">
        <div class="proj-bar-actual" style="width:${actualPct}%"></div><div class="proj-bar-proj" style="width:${projPct}%"></div>
        <span class="proj-bar-label">${p.projTotal.toFixed(0)}</span>
      </div>
    </div>`;
  }).join('');

  return `<h2 class="section-title">Season Projection</h2>
<p class="scoring-note">Unplayed rounds projected using each player's season average Stableford score. Bonus points shown are actual only — projected bonus not included.</p>
<div class="proj-legend">
  <span><span class="swatch actual"></span> Actual points</span>
  <span><span class="swatch projected"></span> Projected (avg)</span>
</div>
<div class="proj-bar-wrap">${bars}</div>
<div class="proj-wrap"><table class="proj-table">
  <thead><tr><th>#</th><th>Player</th><th>Played</th><th>Actual Total</th><th>Projected Add</th><th class="proj-col">Proj. Final</th><th>Basis</th></tr></thead>
  <tbody>${rows}</tbody>
</table></div>
<p class="proj-note">* Projected bonus assumes no additional weekly wins for unplayed rounds. Actual results may differ significantly.</p>`;
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function renderStats(players, allRes, weeks) {
  const data = players.map(name => {
    const played = Object.entries(allRes).filter(([,r]) => r[name]);
    const grossScores = played.map(([wk,]) => weeks[wk].scores[name].holes.reduce((a,b)=>a+b,0));
    const stabScores  = played.map(([,r]) => r[name].stableford);
    const n = played.length;
    return { name, avgGross: n?(grossScores.reduce((a,b)=>a+b,0)/n).toFixed(1):'–', avgStab: n?stabScores.reduce((a,b)=>a+b,0)/n:0, avgStabD: n?(stabScores.reduce((a,b)=>a+b,0)/n).toFixed(1):'–', lowGross: n?Math.min(...grossScores):'–', highStab: n?Math.max(...stabScores):'–', wins: Object.values(allRes).filter(r=>r[name]?.isWinner).length };
  }).sort((a,b) => b.avgStab - a.avgStab);
  const rows = data.map(p => `<tr><td class="player-name">${p.name}</td><td class="stat-highlight">${p.avgGross}</td><td class="stat-highlight">${p.avgStabD}</td><td class="stat-highlight">${p.lowGross}</td><td class="stat-highlight">${p.highStab}</td><td class="stat-highlight">${p.wins}</td></tr>`).join('');
  return `<h2 class="section-title">Advanced Stats</h2>
<div class="stats-wrap"><table class="stats-table"><thead><tr><th>Player</th><th>Avg Gross</th><th>Avg Net Stableford</th><th>Low Gross</th><th>High Stableford</th><th>Wins</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ── Tab Logic ─────────────────────────────────────────────────────────────────
function showWeek(n) {
  document.querySelectorAll('.week-card').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.week-tab').forEach(t=>t.classList.remove('active'));
  const card = document.getElementById('week-'+n), tab = document.getElementById('tab-'+n);
  if (card) card.classList.add('active');
  if (tab)  tab.classList.add('active');
}

// ── Main ──────────────────────────────────────────────────────────────────────
async function main() {
  try {
    const data = await (await fetch('league_data.json')).json();
    const { league, schedule, weeks } = data;
    const players = league.players;

    const allRes = {};
    Object.entries(weeks).forEach(([wk, week]) => { allRes[parseInt(wk)] = calcWeek(week); });

    const playedWeeks = schedule.filter(s => s.played && weeks[s.week]).map(s => s.week);
    const lastWeek = playedWeeks.length ? Math.max(...playedWeeks) : 1;

    const tabs = playedWeeks.map(wk => {
      const s = schedule.find(x => x.week === wk);
      return `<button class="week-tab" onclick="showWeek(${wk})" id="tab-${wk}">Week ${wk}<span class="tab-course">${shortCourse(s.course)}</span></button>`;
    }).join('');

    const cards = playedWeeks.map(wk => renderScorecard(wk, weeks[wk], allRes[wk], schedule)).join('');

    document.getElementById('loading').style.display = 'none';
    const app = document.getElementById('app');
    app.style.display = 'block';
    app.innerHTML = `
      ${renderStandings(players, allRes)}
      ${renderSchedule(schedule, allRes)}
      <h2 class="section-title">Scorecards</h2>
      <div class="week-tabs">${tabs}</div>
      ${cards}
      <p class="scoring-note">* Highlighted holes represent stroke holes.</p>
      ${renderProjections(players, allRes, schedule, weeks)}
      ${renderStats(players, allRes, weeks)}
    `;

    showWeek(lastWeek);

    document.querySelector('.container').insertAdjacentHTML('afterend',
      `<div class="footer">${league.badge} · ${league.name} · Dynamically rendered from league_data.json</div>`
    );
  } catch(err) {
    document.getElementById('loading').textContent = 'Error loading data: ' + err.message;
    console.error(err);
  }
}
main();
</script>
</body></html>
